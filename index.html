<title>PV Check FCS Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --navy:#16255E; --navy-2:#0F1B45; --navy-soft:#22367F;
  --cyan:#22A7DE; --cyan-deep:#1478B0;
  --ground:#F2F5FA; --surface:#FFFFFF; --surface-2:#F8FAFD;
  --line:#DCE3F0; --line-strong:#C2CDE4;
  --text:#182541; --text-2:#5A6785; --text-3:#8792AB;
  --ok:#0F7C5E; --ok-bg:#E4F5EF;
  --warn:#B26A05; --warn-bg:#FDF1DE;
  --bad:#C0342F; --bad-bg:#FCE9E8;
  --focus:#22A7DE;
  --r:12px; --r-s:8px;
  --shadow:0 1px 2px rgba(22,37,94,.06), 0 8px 24px -12px rgba(22,37,94,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --navy:#1B2C6E; --navy-2:#0A1230; --navy-soft:#2C3F8C;
    --cyan:#39B7EC; --cyan-deep:#6FCDF5;
    --ground:#080D1E; --surface:#111A35; --surface-2:#0D1529;
    --line:#25325A; --line-strong:#35457A;
    --text:#E6ECF9; --text-2:#A3AFC9; --text-3:#7B88A6;
    --ok:#4ED3A8; --ok-bg:#0E3630;
    --warn:#E9AC4E; --warn-bg:#392A10;
    --bad:#F2807B; --bad-bg:#3B1917;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --navy:#1B2C6E; --navy-2:#0A1230; --navy-soft:#2C3F8C;
  --cyan:#39B7EC; --cyan-deep:#6FCDF5;
  --ground:#080D1E; --surface:#111A35; --surface-2:#0D1529;
  --line:#25325A; --line-strong:#35457A;
  --text:#E6ECF9; --text-2:#A3AFC9; --text-3:#7B88A6;
  --ok:#4ED3A8; --ok-bg:#0E3630;
  --warn:#E9AC4E; --warn-bg:#392A10;
  --bad:#F2807B; --bad-bg:#3B1917;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--text);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Archivo,"Public Sans",sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--ground)}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;
  border-bottom:3px solid var(--cyan);
}
.topbar-in{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:760px;margin:0 auto}
.topbar img{height:34px;width:auto;display:block;flex:none}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:Archivo;font-size:13px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;line-height:1.2}
.brand span{font-size:11px;color:#B9C6EE;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{
  flex:none;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);color:#fff;
  border-radius:var(--r-s);padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;
}
.iconbtn:hover{background:rgba(255,255,255,.2)}
main{flex:1;padding:16px 16px 120px}

/* ---------- steps rail ---------- */
.rail{display:flex;gap:6px;padding:12px 16px 0;max-width:760px;margin:0 auto;width:100%}
.rail div{flex:1;height:4px;border-radius:99px;background:var(--line-strong);transition:background .25s}
.rail div.done{background:var(--cyan-deep)}
.rail div.now{background:var(--cyan)}
.steplabel{max-width:760px;margin:0 auto;padding:8px 16px 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.steplabel .n{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;color:var(--cyan-deep);letter-spacing:.08em;text-transform:uppercase}
.steplabel .t{font-size:12px;color:var(--text-3)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card>h2{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card>h2::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--cyan);flex:none}
.page-h{margin:2px 0 16px}
.page-h h1{font-size:26px;font-weight:800;line-height:1.15}
.page-h p{margin:6px 0 0;color:var(--text-2);font-size:14px}

/* ---------- fields ---------- */
.grid{display:grid;gap:12px}
@media(min-width:620px){.grid.two{grid-template-columns:1fr 1fr}}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.f label .req{color:var(--bad);margin-left:2px}
.f input,.f select,.f textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r-s);
  padding:11px 12px;font-size:16px;transition:border-color .15s,background .15s;
}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--cyan);background:var(--surface);outline:none;box-shadow:0 0 0 3px rgba(34,167,222,.16)}
.f textarea{min-height:84px;resize:vertical;font-size:15px}
.f.err input,.f.err select,.f.err textarea,.f.err .segwrap{border-color:var(--bad);background:var(--bad-bg)}
.f .hint{font-size:12px;color:var(--text-3)}
.f .msg{font-size:12px;color:var(--bad);font-weight:600;display:none}
.f.err .msg{display:block}
.f input.mono{font-family:"IBM Plex Mono",monospace;letter-spacing:.05em;text-transform:uppercase}

/* segmented control */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  flex:1 1 auto;min-width:64px;background:var(--surface-2);border:1px solid var(--line-strong);
  border-radius:var(--r-s);padding:11px 10px;font-size:14px;font-weight:600;color:var(--text-2);cursor:pointer;transition:.15s
}
.seg button:hover{border-color:var(--line-strong);color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.seg button[aria-pressed="true"][data-v="OUI"],.seg button[aria-pressed="true"][data-v="BON"]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="NON"],.seg button[aria-pressed="true"][data-v="MAUVAIS"]{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button[aria-pressed="true"][data-v="MOYEN"]{background:var(--warn);border-color:var(--warn);color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row>span{font-size:14.5px;font-weight:500}
.row .seg{flex:none}
.row .seg button{min-width:58px;padding:8px 12px}
.row.err{background:var(--bad-bg);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:var(--r-s)}

/* ---------- home ---------- */
.hero{padding:22px 0 8px}
.hero .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan-deep);font-weight:600}
.hero h1{font-size:32px;font-weight:800;line-height:1.08;margin-top:8px}
.hero p{color:var(--text-2);margin:10px 0 0;max-width:52ch}
.choice{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cyan);
  border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);transition:.18s
}
.choice:hover{transform:translateY(-1px);border-color:var(--line-strong);border-left-color:var(--cyan)}
.choice .ic{flex:none;width:42px;height:42px;border-radius:10px;background:var(--navy);display:grid;place-items:center}
.choice .ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.choice .tx{flex:1;min-width:0}
.choice .tx b{display:block;font-family:Archivo;font-size:16.5px;font-weight:700}
.choice .tx span{display:block;font-size:13px;color:var(--text-2);margin-top:2px}
.choice .go{flex:none;color:var(--text-3);font-size:20px;line-height:1}

/* ---------- vehicle views ---------- */
.views{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.view{position:relative;background:#fff;border:1px solid var(--line-strong);border-radius:var(--r-s);overflow:hidden;cursor:crosshair;touch-action:manipulation;padding:4px}
.view .vlabel{position:absolute;top:6px;left:6px;z-index:2;background:var(--navy);color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:3px 7px;border-radius:4px;pointer-events:none}
.view img.car{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.view .mk{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--bad);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.3);pointer-events:none}
.hintbar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:var(--r-s);padding:9px 11px;margin-bottom:10px}

/* ---------- damage list ---------- */
.dmg{border:1px solid var(--line);border-radius:var(--r-s);padding:12px;margin-top:10px;background:var(--surface-2)}
.dmg.need{border-color:var(--bad);background:var(--bad-bg)}
.dmg-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dmg-h .num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bad);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.dmg-h b{flex:1;font-family:Archivo;font-size:14.5px}
.dmg-h .where{font-size:11.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.linkbtn{background:none;border:0;color:var(--bad);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px;text-decoration:underline}
.photoslot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.photoslot img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line-strong)}
.addphoto{
  display:inline-flex;align-items:center;gap:7px;background:var(--navy);color:#fff;border:0;border-radius:var(--r-s);
  padding:10px 14px;font-size:13.5px;font-weight:600;cursor:pointer
}
.addphoto.warn{background:var(--bad)}
.addphoto svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:99px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.empty{text-align:center;padding:18px;color:var(--text-3);font-size:13.5px}

/* ---------- signature ---------- */
.sigbox{border:1px solid var(--line-strong);border-radius:var(--r-s);background:#fff;position:relative;overflow:hidden}
.sigbox canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}
.sigbox .ph{position:absolute;inset:0;display:grid;place-items:center;color:#9AA5BE;font-size:13.5px;pointer-events:none}
.sigbox.signed .ph{display:none}
.sigfoot{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.sigfoot span{font-size:12px;color:var(--text-3)}

/* ---------- stars ---------- */
.stars{display:flex;gap:8px;justify-content:center;margin:6px 0 4px}
.stars button{background:none;border:0;cursor:pointer;padding:4px;line-height:0}
.stars svg{width:38px;height:38px;fill:var(--line-strong);transition:fill .12s,transform .12s}
.stars button.on svg{fill:#F5A623}
.stars button:hover svg{transform:scale(1.08)}
.starlabel{text-align:center;font-family:Archivo;font-weight:700;font-size:15px;color:var(--text);min-height:22px}

/* ---------- bottom bar ---------- */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px -12px rgba(22,37,94,.35)}
.bottom-in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:var(--r-s);padding:14px 16px;font-family:Archivo;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-soft)}
.btn.ghost{flex:0 0 auto;background:var(--surface-2);color:var(--text-2);border:1px solid var(--line-strong)}
.btn.cyan{background:var(--cyan-deep);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.formerr{max-width:760px;margin:0 auto 10px;background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);border-radius:var(--r-s);padding:9px 12px;font-size:13px;font-weight:600;display:none}
.formerr.on{display:block}

/* ---------- history ---------- */
.hitem{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.hitem:last-child{border-bottom:0}
.hitem .tag{flex:none;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:4px 8px;border-radius:5px;background:var(--navy);color:#fff;min-width:78px;text-align:center}
.hitem .tag.rec{background:var(--cyan-deep)}
.hitem .tag.lav{background:var(--ok)}
.hitem .meta{flex:1;min-width:0}
.hitem .meta b{display:flex;align-items:center;gap:7px;font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;letter-spacing:.04em}
.hitem .meta b .pill{flex:none}
.hitem .meta span{display:block;font-size:12.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hitem .dl{flex:none;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r-s);padding:9px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text)}
.gauge{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.gauge i{display:block;height:100%;background:var(--cyan)}
.note{font-size:12.5px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:var(--r-s);padding:10px 12px;margin-top:12px}

/* ---------- recap ---------- */
.recap{display:grid;gap:0}
.recap div{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.recap div:last-child{border-bottom:0}
.recap div span:first-child{color:var(--text-2)}
.recap div span:last-child{font-weight:600;text-align:right}

/* ---------- toast / overlay ---------- */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:80;background:var(--navy);color:#fff;padding:12px 18px;border-radius:99px;font-size:13.5px;font-weight:600;box-shadow:0 8px 30px -8px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.overlay{position:fixed;inset:0;z-index:90;background:rgba(8,13,30,.72);display:none;place-items:center;padding:24px}
.overlay.on{display:grid}
.overlay .box{background:var(--surface);border-radius:var(--r);padding:26px;text-align:center;max-width:340px;width:100%;box-shadow:var(--shadow)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--cyan);border-radius:50%;margin:0 auto 14px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.hide{display:none!important}
</style>
</head>

var C = { navy: '#16255E', navy2: '#0F1B45', cyan: '#22A7DE', ink: '#182541', mid: '#5A6785', soft: '#8792AB', line: '#DCE3F0', bg: '#F2F5FA', bg2: '#F8FAFD', ok: '#0F7C5E', bad: '#C0342F', warn: '#B26A05', gold: '#F5A623' };

function groupNum(v) {
  return String(v).replace(/\D/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
}
function valColor(v) {
  if (v === 'OUI' || v === 'BON') return C.ok;
  if (v === 'NON' || v === 'MAUVAIS') return C.bad;
  if (v === 'MOYEN') return C.warn;
  return C.ink;
}

function pvFileName(pv) {
  var t = { recuperation: 'PVRecuperation', livraison: 'PVLivraison', lavage: 'PVCheckLavage' }[pv.type];
  return t + '_' + (plate(pv.immat) || 'SANSIMMAT').replace(/-/g, '') + '_' + fr(pv.date).replace(/\//g, '') + '.pdf';
}

function buildPdf(pv) {
  var d = new Doc();
  var M = d.M, CW = d.CW(), R = M + CW;
  var imgs = {};

  var jobs = [logoJpeg('#16255E', 300).then(function (r) { imgs.logoNavy = r; })];
  VIEWS.forEach(function (v) {
    jobs.push(viewIndexed(v).then(function (ix) {
      if (ix) { imgs['v_' + v.k] = ix; return; }
      return renderView(v, pv.damages, 2).then(function (u) { imgs['v_' + v.k] = u; imgs.flat = true; });
    }));
  });
  if (pv.sigClient) jobs.push(dataUrlToJpeg(pv.sigClient, 0.85).then(function (u) { imgs.sc = u; }));
  if (pv.sigDriver) jobs.push(dataUrlToJpeg(pv.sigDriver, 0.85).then(function (u) { imgs.sd = u; }));

  return Promise.all(jobs).then(function () {
    var slimOn = false;

    function slimHeader() {
      d.rect(0, 0, d.W, 26, C.navy);
      d.rect(0, 26, d.W, 2, C.cyan);
      d.text(M, 8, TYPES[pv.type].label.toUpperCase(), { size: 8, bold: true, color: '#FFFFFF', spacing: 0.6 });
      d.text(R, 8, plate(pv.immat) + '   ·   ' + fr(pv.date), { size: 8, bold: true, color: '#B9C6EE', align: 'right' });
      d.y = 46;
    }
    function ensure(h) {
      if (d.y + h > d.H - 44) { d.newPage(); slimHeader(); return true; }
      return false;
    }
    function sec(title, need) {
      ensure(need || 46);
      d.rect(M, d.y, CW, 19, C.navy);
      d.text(M + 10, d.y + 5.4, title.toUpperCase(), { size: 8.4, bold: true, color: '#FFFFFF', spacing: 1.3 });
      d.rect(M, d.y + 19, CW, 2.2, C.cyan);
      d.y += 21.2 + 9;
    }
    function kv(label, value, i, vcolor) {
      ensure(19);
      if (i % 2 === 0) d.rect(M, d.y, CW, 18, C.bg2);
      d.line(M, d.y + 18, R, d.y + 18, C.line, 0.5);
      d.text(M + 9, d.y + 5, label, { size: 9, color: C.mid, max: CW * 0.6 });
      d.text(R - 9, d.y + 5, value, { size: 9, bold: true, color: vcolor || C.ink, align: 'right', max: CW * 0.38 });
      d.y += 18;
    }
    function para(txt, opts) {
      opts = opts || {};
      var size = opts.size || 9, pad = 9;
      var lines = wrapText(txt, size, false, CW - pad * 2);
      var h = lines.length * (size + 3.6) + pad * 1.6;
      ensure(h + 4);
      d.rect(M, d.y, CW, h, opts.bg || C.bg2, opts.border || C.line, 0.6);
      if (opts.accent) d.rect(M, d.y, 2.6, h, opts.accent);
      var ty = d.y + pad * 0.8;
      lines.forEach(function (l) { d.text(M + pad + 3, ty, l, { size: size, color: opts.color || C.ink }); ty += size + 3.6; });
      d.y += h + 8;
    }
    function label(t) {
      ensure(16);
      d.text(M, d.y, t.toUpperCase(), { size: 7.6, bold: true, color: C.soft, spacing: 0.9 });
      d.y += 12;
    }

    /* ---------- EN-TÊTE ---------- */
    d.rect(0, 0, d.W, 84, C.navy);
    d.rect(0, 84, d.W, 3.2, C.cyan);
    var lw = 46 / imgs.logoNavy.ratio;
    d.image(d.addImage(imgs.logoNavy.url), M, 19, lw, 46);
    d.text(d.W / 2 + 14, 22, TYPES[pv.type].label.toUpperCase(), { size: 17.5, bold: true, color: '#FFFFFF', align: 'center', spacing: 0.9 });
    d.text(d.W / 2 + 14, 47, COMPANY.name + ' — ' + COMPANY.addr, { size: 7.8, color: '#B9C6EE', align: 'center' });
    d.text(d.W / 2 + 14, 58, 'Tél : ' + COMPANY.tel + '   ·   Réf. ' + pv.id, { size: 7.8, color: '#B9C6EE', align: 'center' });
    d.y = 87 + 16;

    /* ---------- BLOC INFOS ---------- */
    var rows = [
      ['DATE', fr(pv.date), 'IMMATRICULATION', plate(pv.immat)],
      ['DRIVER', pv.driver, 'CLIENT', pv.client],
      ['MISSION N°', pv.mission, 'ADRESSE', pv.adresse]
    ];
    var bh = rows.length * 21 + 14;
    d.rect(M, d.y, CW, bh, C.bg, C.line, 0.7);
    d.rect(M, d.y, 2.6, bh, C.cyan);
    var iy = d.y + 8, half = CW / 2;
    rows.forEach(function (r) {
      d.text(M + 14, iy + 5.5, r[0], { size: 7.4, bold: true, color: C.soft, spacing: 0.7 });
      d.text(M + 14 + 84, iy + 4.4, r[1], { size: 9.4, bold: true, color: C.ink, max: half - 108 });
      d.text(M + half + 8, iy + 5.5, r[2], { size: 7.4, bold: true, color: C.soft, spacing: 0.7 });
      d.text(M + half + 8 + 84, iy + 4.4, r[3], { size: 9.4, bold: true, color: C.ink, max: half - 100 });
      iy += 21;
    });
    d.y += bh + 16;

    /* place un schéma, avec ses marqueurs en vectoriel si possible */
    function drawView(key, x, y, w, h) {
      var im = imgs['v_' + key];
      d.rect(x, y, w, h, '#FFFFFF', C.line, 0.7);
      if (im && im.bytes) {
        d.image(d.addIndexed(im), x + 3, y + 3, w - 6, h - 6);
        pv.damages.forEach(function (dm) {
          if (dm.view !== key) return;
          d.marker(x + 3 + dm.x / 100 * (w - 6), y + 3 + dm.y / 100 * (h - 6), Math.max(5.4, w * 0.026), dm.n);
        });
      } else if (im) {
        d.image(d.addImage(im), x + 3, y + 3, w - 6, h - 6);
      }
      var lb = viewOf(key).l.toUpperCase();
      var lw2 = textW(lb, 6.2, true) + lb.length * 0.5;   /* + interlettrage */
      d.rect(x + 4, y + 4, lw2 + 11, 11, C.navy);
      d.text(x + 9, y + 6.4, lb, { size: 6.2, bold: true, color: '#FFFFFF', spacing: 0.5 });
    }

    /* ---------- ÉTAT DU VÉHICULE ---------- */
    sec('État du véhicule');
    var gw = (CW - 8) / 2;
    var frontH = gw * viewOf('avant').ratio, sideH = gw * viewOf('gauche').ratio;
    ensure(frontH + sideH + 30);
    drawView('avant', M, d.y, gw, frontH);
    drawView('arriere', M + gw + 8, d.y, gw, frontH);
    d.y += frontH + 8;
    drawView('gauche', M, d.y, gw, sideH);
    drawView('droit', M + gw + 8, d.y, gw, sideH);
    d.y += sideH + 14;

    /* dommages */
    ensure(30);
    d.rect(M, d.y, CW, 20, C.bg);
    d.text(M + 9, d.y + 5.6, 'Dommages relevés', { size: 9, bold: true, color: C.ink });
    d.text(R - 9, d.y + 5.6, pv.damages.length ? pv.damages.length + ' marqueur(s)' : 'Aucun dommage', { size: 9, bold: true, color: pv.damages.length ? C.bad : C.ok, align: 'right' });
    d.y += 20;
    pv.damages.forEach(function (dm, i) {
      ensure(20);
      d.rect(M, d.y, CW, 19, i % 2 ? C.bg2 : '#FFFFFF', C.line, 0.5);
      d.rect(M, d.y, 2.6, 19, C.bad);
      d.text(M + 10, d.y + 5.4, dm.n + '.  ' + dm.label, { size: 8.8, bold: true, color: C.ink, max: CW * 0.44 });
      var lv = viewOf(dm.view).l;
      d.text(M + CW * 0.52, d.y + 5.6, lv, { size: 8.2, color: C.mid, max: CW * 0.2 });
      d.text(R - 9, d.y + 5.6, dm.note ? dm.note : '—', { size: 8.2, color: C.mid, align: 'right', max: CW * 0.24 });
      d.y += 19;
    });
    d.y += 12;

    if (pv.reco && pv.reco.trim()) {
      label('Recommandation changement de pièces');
      para(pv.reco, { accent: C.warn, bg: '#FDF8EF', border: '#EDD9B4' });
    }

    /* ---------- ÉQUIPEMENTS ---------- */
    sec('Équipements', 90);
    EQUIP.forEach(function (f, i) {
      var v = pv.equip[f.k];
      kv(f.l, f.k === 'km' ? (v ? groupNum(v) + ' km' : '—') : (v || '—'), i, valColor(v));
    });
    d.y += 10;

    sec('Kit sécurité', 90);
    SECU.forEach(function (f, i) { kv(f.l, pv.secu[f.k] || '—', i, valColor(pv.secu[f.k])); });
    d.y += 10;

    sec('État des pneus', 72);
    PNEUS.forEach(function (f, i) { kv(f.l, pv.pneus[f.k] || '—', i, valColor(pv.pneus[f.k])); });
    d.y += 10;

    /* ---------- TRAVAUX ---------- */
    var tw = TYPES[pv.type].travaux;
    if (tw) {
      sec('Travaux réalisés', 90);
      var i2 = 0;
      tw.forEach(function (k) {
        var f = TRAVAUX[k];
        if (f.dep && pv.travaux[f.dep] !== 'OUI') return;
        kv(f.l, pv.travaux[k] || '—', i2++, valColor(pv.travaux[k]));
      });
      d.y += 10;
      if (pv.comment && pv.comment.trim()) {
        label('Commentaires libres');
        para(pv.comment, { accent: C.cyan });
      }
    }

    /* ---------- SATISFACTION ---------- */
    sec('Satisfaction client', 130);
    var sx = d.W / 2 - 4 * 15;
    for (var s = 1; s <= 5; s++) d.star(sx + (s - 1) * 30, d.y + 12, 11, s <= pv.note);
    d.text(d.W / 2, d.y + 30, pv.note + '/5 — ' + (NOTE_LABEL[pv.note] || ''), { size: 10, bold: true, color: C.ink, align: 'center' });
    d.y += 48;
    if (pv.noteComment && pv.noteComment.trim()) para('« ' + pv.noteComment.trim() + ' »', { accent: C.cyan, color: C.mid });

    /* ---------- PHOTOS ---------- */
    var photos = [];
    pv.damages.forEach(function (dm) { (dm.photos || []).forEach(function (p) { photos.push({ d: dm, p: p }); }); });
    if (photos.length) {
      var pw = (CW - 10) / 2, ph = pw * 0.72;
      sec('Photos des dommages (' + photos.length + ')', ph + 76);
      for (var i = 0; i < photos.length; i += 2) {
        ensure(ph + 30);
        for (var j = 0; j < 2 && i + j < photos.length; j++) {
          var it = photos[i + j], x = M + j * (pw + 10);
          d.rect(x, d.y, pw, ph, C.bg2, C.line, 0.6);
          d.image(d.addImage(it.p), x, d.y, pw, ph);
          d.text(x, d.y + ph + 5, 'Dommage ' + it.d.n + ' — ' + it.d.label, { size: 7.8, bold: true, color: C.ink, max: pw });
          d.text(x, d.y + ph + 15, viewOf(it.d.view).l, { size: 7.4, color: C.soft, max: pw });
        }
        d.y += ph + 28;
      }
    }

    /* ---------- SIGNATURES ---------- */
    sec('Signatures', 210);
    var sw = (CW - 14) / 2, sh = 76;
    [[imgs.sc, 'Signature du client', 0], [imgs.sd, 'Driver : ' + pv.driver, 1]].forEach(function (p) {
      var x = M + p[2] * (sw + 14);
      d.rect(x, d.y, sw, sh, '#FFFFFF', C.line, 0.7);
      if (p[0]) d.image(d.addImage(p[0]), x + 4, d.y + 4, sw - 8, sh - 8);
      d.line(x, d.y + sh + 2, x + sw, d.y + sh + 2, C.navy, 1.1);
      d.text(x + sw / 2, d.y + sh + 8, p[1], { size: 8, color: C.mid, align: 'center', max: sw });
    });
    d.y += sh + 26;
    ensure(30);
    d.text(d.W / 2, d.y, 'Document généré électroniquement — ' + COMPANY.name, { size: 7.6, color: C.soft, align: 'center' });
    d.text(d.W / 2, d.y + 11, 'Généré le ' + new Date().toLocaleString('fr-FR'), { size: 7.6, color: C.soft, align: 'center' });

    /* ---------- PIEDS DE PAGE ---------- */
    var n = d.pages.length;
    d.pages.forEach(function (pg, i) {
      d.p = pg;
      d.line(M, d.H - 34, R, d.H - 34, C.line, 0.6);
      d.text(M, d.H - 27, COMPANY.name + ' — ' + COMPANY.addr + ' — Tél : ' + COMPANY.tel, { size: 6.6, color: C.soft, max: CW - 60 });
      d.text(R, d.H - 27, 'Page ' + (i + 1) + ' / ' + n, { size: 6.6, bold: true, color: C.soft, align: 'right' });
    });

    return d.build();
  });
}

/* =========================================================
   Interface
   ========================================================= */
function segHtml(name, opts, cur) {
  return '<div class="seg" data-seg="' + name + '">' + opts.map(function (o) {
    return '<button type="button" data-v="' + esc(o) + '" aria-pressed="' + (cur === o ? 'true' : 'false') + '">' + esc(o) + '</button>';
  }).join('') + '</div>';
}
function boolRow(f, sname) {
  var store = S[sname];
  return '<div class="row" data-store="' + sname + '" data-row="' + f.k + '"><span>' + esc(f.l) + '</span>' + segHtml(f.k, ['OUI', 'NON'], store[f.k]) + '</div>';
}
function segRow(f, sname) {
  var store = S[sname];
  return '<div class="row" data-store="' + sname + '" data-row="' + f.k + '"><span>' + esc(f.l) + '</span>' + segHtml(f.k, f.opts, store[f.k]) + '</div>';
}
function field(k, label, opts) {
  opts = opts || {};
  var v = esc(S[k] || '');
  var inp = opts.textarea
    ? '<textarea data-f="' + k + '" placeholder="' + esc(opts.ph || '') + '">' + v + '</textarea>'
    : '<input data-f="' + k + '" type="' + (opts.type || 'text') + '" value="' + v + '" placeholder="' + esc(opts.ph || '') + '"' + (opts.mono ? ' class="mono"' : '') + (opts.mode ? ' inputmode="' + opts.mode + '"' : '') + '>';
  return '<div class="f" data-fw="' + k + '"><label>' + esc(label) + (opts.opt ? '' : '<span class="req">*</span>') + '</label>' + inp +
    (opts.hint ? '<span class="hint">' + esc(opts.hint) + '</span>' : '') + '<span class="msg">Champ obligatoire</span></div>';
}

    ['lavage', 'Contrôle après lavage vapeur et prestations atelier', 'M4 12a8 8 0 0 1 16 0M12 3v2M6 21c0-2 1.5-3 3-3s3 1 3 3 1.5 3 3 3M8 12v4M12 12v6M16 12v4']

    '<div style="font-size:13px;color:var(--text-2)">' + esc(TYPES[lrec.type].label) + ' &middot; ' + esc(plate(lrec.immat)) + '</div></div>' +
    '<button class="dl" data-dl="' + esc(lrec.id) + '" type="button">PDF</button></div>' +
    '<button class="btn ghost" style="width:100%;margin-top:10px" data-act="mail-last" type="button">Envoyer par email</button></div>' : '';
  return '<div class="hero">' +
    '<div class="eyebrow">' + esc(COMPANY.name) + '</div>' +
    '<h1>Quel procès-verbal<br>établissez-vous&nbsp;?</h1>' +
    '<p>Sélectionnez le type de PV. Le formulaire s\'adapte automatiquement et le PDF est généré à la fin, signatures comprises.</p></div>' + banner +
    items.map(function (it) {
      var t = TYPES[it[0]];
      return '<button class="choice" data-new="' + it[0] + '" type="button">' +
        '<span class="ic"><svg viewBox="0 0 24 24"><path d="' + it[2] + '"/></svg></span>' +
        '<span class="tx"><b>' + esc(t.label) + '</b><span>' + esc(it[1]) + '</span></span>' +
        '<span class="go">›</span></button>';
    }).join('') +
    '<div class="card" style="margin-top:18px"><h2>Historique</h2>' +
    (HIST.length
      ? '<p style="margin:0 0 12px;color:var(--text-2);font-size:14px">' + HIST.length + ' PV enregistré' + (HIST.length > 1 ? 's' : '') + ' par l\'équipe.</p>' +
        HIST.slice(0, 3).map(histRow).join('') +
        '<button class="btn ghost" style="width:100%;margin-top:12px" data-go="history" type="button">Voir tout l\'historique</button>'
      : '<div class="empty">Aucun PV enregistré pour le moment.</div>') +
    '</div>';
}

function histRow(r) {
  return '<div class="hitem"><span class="tag ' + TYPES[r.type].tag + '">' + esc(TYPES[r.type].short) + '</span>' +
    '<span class="meta"><b>' + esc(plate(r.immat)) + (r._pending ? ' <span class="pill warn" style="font-size:9px;padding:2px 6px">à envoyer</span>' : '') + '</b><span>' + esc(fr(r.date)) + ' · ' + esc(r.client) + ' · ' + esc(r.driver) + '</span></span>' +
    '<button class="dl" data-dl="' + esc(r.id) + '" type="button">PDF</button></div>';
}

function statusCard() {
  var st = typeof storeStatus === 'function' ? storeStatus() : null;
  if (!st) {
    if (!HIST.length) return '';
    var kb = Math.round(JSON.stringify(HIST).length / 1024);
    var pct = Math.min(100, Math.round(kb / 12000 * 100));
    return '<div class="card"><h2>Espace utilisé</h2>' +
      '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-2)"><span>' + HIST.length + ' PV · ' + kb + ' Ko</span><span>' + pct + ' %</span></div>' +
      '<div class="gauge"><i style="width:' + pct + '%"></i></div>' +
      '<div class="note">Les photos sont compressées automatiquement. Au-delà de ~80 %, archivez les anciens PV.</div></div>';
  }
  var pillCls = st.tone === 'ok' ? 'ok' : st.tone === 'bad' ? 'bad' : 'warn';
  return '<div class="card"><h2>Synchronisation</h2>' +
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
    '<span class="pill ' + pillCls + '">' + esc(st.title) + '</span></div>' +
    '<div style="font-size:13px;color:var(--text-2);word-break:break-word">' + esc(st.text) + '</div>' +
    (st.retry ? '<button class="btn ghost" style="width:100%;margin-top:12px" data-act="sync" type="button">Réessayer maintenant</button>' : '') +
    '</div>';
}

function screenHistory() {

function screenStep2() {

    }).join('') + '</div></div>' +
    '<div class="card"><h2>Dommages relevés</h2><div id="dmgList"></div></div>' +

/* =========================================================
   Contrôleur
   ========================================================= */
function render() {
  var v = $('view'), rw = $('railWrap'), bt = $('bottom');
  $('formerr').classList.remove('on');

  if (screen === 'home') { v.innerHTML = screenHome(); rw.classList.add('hide'); bt.classList.add('hide'); $('brandSub').textContent = COMPANY.name; }
  else if (screen === 'history') {
    v.innerHTML = screenHistory(); rw.classList.add('hide'); bt.classList.remove('hide');
    $('brandSub').textContent = HIST.length + ' PV enregistré' + (HIST.length > 1 ? 's' : '');
    $('bottomIn').innerHTML = '<button class="btn primary" data-go="home" type="button">Retour à l\'accueil</button>';
  }
  else if (screen === 'done') {
    v.innerHTML = screenDone(); rw.classList.add('hide'); bt.classList.remove('hide');
    $('brandSub').textContent = TYPES[S.type].label + ' · ' + plate(S.immat);
    $('bottomIn').innerHTML = '<button class="btn primary" data-go="home" type="button">Nouveau PV</button>';
  }
  else {
    var steps = stepsFor(S.type), idx = steps.map(function (s) { return s.n; }).indexOf(step);
    rw.classList.remove('hide'); bt.classList.remove('hide');
    $('brandSub').textContent = TYPES[S.type].label + (S.immat ? ' · ' + plate(S.immat) : '');
    $('rail').innerHTML = steps.map(function (s, i) { return '<div class="' + (i < idx ? 'done' : i === idx ? 'now' : '') + '"></div>'; }).join('');
    $('stepN').textContent = 'Étape ' + (idx + 1) + ' / ' + steps.length;
    $('stepT').textContent = steps[idx].t;
    v.innerHTML = ({ 1: screenStep1, 2: screenStep2, 3: screenStep3, 4: screenStep4, 5: screenStep5 })[step]();
    var last = idx === steps.length - 1;
    $('bottomIn').innerHTML =
      '<button class="btn ghost" data-nav="prev" type="button">' + (idx === 0 ? 'Annuler' : 'Retour') + '</button>' +
      '<button class="btn primary" data-nav="next" type="button">' + (last ? 'Finaliser le PV' : 'Continuer') + '</button>';
    if (step === 2) { renderDmgList(); paintMarkers(); }
    if (step === 5) initSignatures();
  }
  window.scrollTo(0, 0);
}

function go(s) { screen = s; render(); }

function nextStep(dir) {
  var steps = stepsFor(S.type), idx = steps.map(function (s) { return s.n; }).indexOf(step);
  if (dir < 0) {
    if (idx === 0) { if (confirm('Abandonner ce PV ? Les informations saisies seront perdues.')) { S = null; go('home'); } return; }
    step = steps[idx - 1].n; render(); return;
  }
  if (!validate()) return;
  if (idx === steps.length - 1) { finalize(); return; }
  step = steps[idx + 1].n; render();
}

/* ---------- validation ---------- */
function fail(msg, nodes) {
  (nodes || []).forEach(function (n) { n.classList.add('err'); });
  var fe = $('formerr'); fe.textContent = msg; fe.classList.add('on');
  var first = (nodes || [])[0];
  if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
  return false;
}
function validate() {
  document.querySelectorAll('.err').forEach(function (n) { n.classList.remove('err'); });
  $('formerr').classList.remove('on');
  var bad = [], i;

  if (step === 1) {
    ['date', 'driver', 'mission', 'immat', 'client', 'adresse'].forEach(function (k) {
      if (!String(S[k] || '').trim()) bad.push(document.querySelector('[data-fw="' + k + '"]'));
    });
    if (bad.length) return fail('Complétez tous les champs pour continuer.', bad);
    if (!/^[A-Z]{2}\d{3}[A-Z]{2}$/.test(String(S.immat).toUpperCase().replace(/[^A-Z0-9]/g, ''))) {
      var n = document.querySelector('[data-fw="immat"]');
      n.querySelector('.msg').textContent = 'Format attendu : AA-000-BB';
      return fail('Immatriculation invalide (format AA-000-BB).', [n]);
    }
    return true;
  }
  if (step === 2) {
    var miss = S.damages.filter(function (d) { return !d.photos.length; });
    if (miss.length) {
      miss.forEach(function (d) { var n = document.querySelector('[data-dmg="' + d.id + '"]'); if (n) n.classList.add('need'); });
      var f = document.querySelector('[data-dmg="' + miss[0].id + '"]');
      if (f) f.scrollIntoView({ block: 'center', behavior: 'smooth' });
      var fe = $('formerr'); fe.textContent = 'Photo obligatoire pour ' + (miss.length > 1 ? 'les dommages ' + miss.map(function (d) { return d.n; }).join(', ') : 'le dommage ' + miss[0].n) + '.';
      fe.classList.add('on');
      return false;
    }
    return true;
  }
  if (step === 3) {
    if (!String(S.equip.km || '').trim()) bad.push(document.querySelector('[data-fw="km"]'));
    EQUIP.slice(1).forEach(function (f) { if (!S.equip[f.k]) bad.push(document.querySelector('[data-store="equip"][data-row="' + f.k + '"]')); });
    SECU.forEach(function (f) { if (!S.secu[f.k]) bad.push(document.querySelector('[data-store="secu"][data-row="' + f.k + '"]')); });
    PNEUS.forEach(function (f) { if (!S.pneus[f.k]) bad.push(document.querySelector('[data-store="pneus"][data-row="' + f.k + '"]')); });
    bad = bad.filter(Boolean);
    if (bad.length) return fail('Renseignez tous les équipements avant de continuer.', bad);
    return true;
  }
  if (step === 4) {
    (TYPES[S.type].travaux || []).forEach(function (k) {
      var f = TRAVAUX[k];
      if (f.dep && S.travaux[f.dep] !== 'OUI') return;
      if (!S.travaux[k]) bad.push(document.querySelector('[data-store="travaux"][data-row="' + k + '"]'));
    });
    bad = bad.filter(Boolean);
    if (bad.length) return fail('Renseignez toutes les prestations.', bad);
    return true;
  }
  if (step === 5) {
    if (!S.sigClient) return fail('La signature du client est obligatoire.', [document.querySelector('[data-sig="Client"]')]);
    if (!S.note) { var fe2 = $('formerr'); fe2.textContent = 'La note de la prestation doit être donnée par le client.'; fe2.classList.add('on'); $('stars').scrollIntoView({ block: 'center', behavior: 'smooth' }); return false; }
    if (!S.sigDriver) return fail('La signature du driver est obligatoire.', [document.querySelector('[data-sig="Driver"]')]);
    return true;
  }
  return true;
}

/* ---------- signature ---------- */
function initSignatures() {
  document.querySelectorAll('.sigbox').forEach(function (box) {
    var who = box.dataset.sig, cv = box.querySelector('canvas');
    var r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    var x = cv.getContext('2d');
    x.scale(dpr, dpr); x.lineWidth = 2.2; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#16255E';
    var saved = who === 'Client' ? S.sigClient : S.sigDriver;
    if (saved) { loadImg(saved).then(function (im) { x.drawImage(im, 0, 0, r.width, r.height); }); box.classList.add('signed'); }
    var drawing = false, last = null;
    function pt(e) { var b = cv.getBoundingClientRect(); var t = e.touches ? e.touches[0] : e; return { x: t.clientX - b.left, y: t.clientY - b.top }; }
    function down(e) { e.preventDefault(); drawing = true; last = pt(e); box.classList.add('signed'); }
    function move(e) {
      if (!drawing) return; e.preventDefault();
      var p = pt(e); x.beginPath(); x.moveTo(last.x, last.y); x.lineTo(p.x, p.y); x.stroke(); last = p;
    }
    function up() {
      if (!drawing) return; drawing = false;
      var url = cv.toDataURL('image/png');
      if (who === 'Client') S.sigClient = url; else S.sigDriver = url;
    }
    cv.addEventListener('mousedown', down); cv.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    cv.addEventListener('touchstart', down, { passive: false });
    cv.addEventListener('touchmove', move, { passive: false });
    cv.addEventListener('touchend', up);
  });
}

/* ---------- PDF ---------- */
function downloadPdf(pv) {
  busy(true, 'Génération du PDF…');
  return buildPdf(pv).then(function (bytes) {
    var name = pvFileName(pv);
    function anchorSave() {
      var blob = new Blob([bytes], { type: 'application/pdf' });
      var url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    }
    return useCap('downloads').then(function (dl) {
      if (!dl) { anchorSave(); toast('PDF généré'); return; }
      return dl.save({ filename: name, data: bytes })
        .then(function () { toast('PDF enregistré'); })
        .catch(function (e) {
          var code = (e && e.code) || '';
          if (code === 'declined') { toast('Enregistrement annulé'); return; }
          if (code === 'rate_limited') { toast('Patientez quelques secondes puis réessayez'); return; }
          if (code === 'too_large') { toast('PDF trop volumineux — réduisez le nombre de photos'); return; }
          anchorSave();
          toast('Ouvrez ce lien dans un navigateur pour enregistrer le PDF');
        });
    });
  }).catch(function (e) {
    toast('Échec de la génération du PDF');
    console.error(e);
  }).then(function () { busy(false); });
}

function mailPv(pv) {

/* =========================================================
   Stockage — version hébergée (local + base centralisée Supabase)
   ---------------------------------------------------------
   RENSEIGNEZ CES DEUX LIGNES avant de mettre le fichier en ligne.
   Elles se trouvent dans Supabase : Project Settings > API
   ========================================================= */
var SUPABASE_URL = 'https://boqxyffsnufcynkprjfc.supabase.co';   /* ex. https://abcdefgh.supabase.co            */
var SUPABASE_KEY = 'sb_publishable_lgDk-v5uC2jzAKOTOTH37g_EhyBOXR6';   /* clé publique : sb_publishable_... ou eyJ...  */
var SUPABASE_TABLE = 'pv';
/* ======================================================= */

var syncState = { pending: 0, lastError: '' };

function cloudOn() { return !!(SUPABASE_URL && SUPABASE_KEY); }
/* accepte https://xxx.supabase.co comme https://xxx.supabase.co/rest/v1/ */
function apiBase() { return String(SUPABASE_URL).trim().replace(/\/+$/, '').replace(/\/rest\/v1$/i, ''); }
function api(path) { return apiBase() + '/rest/v1/' + path; }
function apiHeaders(extra) {
  var h = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' };
  /* Les anciennes clés « anon » sont des JWT et passent aussi en Authorization.
     Les nouvelles clés « publishable » (sb_publishable_...) n'en sont pas :
     les envoyer en Bearer ferait échouer la requête. */
  if (/^eyJ/.test(SUPABASE_KEY)) h['Authorization'] = 'Bearer ' + SUPABASE_KEY;
  for (var k in (extra || {})) h[k] = extra[k];
  return h;
}
function ls(k, v) {
  try {
    if (v === undefined) { var s = localStorage.getItem(k); return s ? JSON.parse(s) : null; }
    localStorage.setItem(k, JSON.stringify(v));
  } catch (e) { }
  return null;
}
function saveLocal() { ls('pvcheck-hist', HIST); }

function storeLoad() {
  var h = ls('pvcheck-hist') || [];
  syncState.pending = h.filter(function (r) { return r._pending; }).length;
  return h;
}

function cloudInsert(rec) {
  var row = {
    ref: rec.id, type: rec.type, pv_date: rec.date,
    immat: plate(rec.immat), client: rec.client, driver: rec.driver,
    damages: rec.damages.length, note: rec.note, data: rec
  };
  return fetch(api(SUPABASE_TABLE), {
    method: 'POST',
    headers: apiHeaders({ 'Prefer': 'return=minimal' }),
    body: JSON.stringify(row)
  }).then(function (r) {
    if (r.ok) return true;
    if (r.status === 409) return true;   /* déjà enregistré : rien à refaire */
    return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ' — ' + t.slice(0, 160)); });
  });
}

function cloudFetch() {
  return fetch(api(SUPABASE_TABLE + '?select=data&order=created_at.desc&limit=400'), { headers: apiHeaders() })
    .then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ' — ' + t.slice(0, 160)); });
      return r.json();
    })
    .then(function (rows) { return rows.map(function (x) { return x.data; }).filter(Boolean); });
}

/* fusionne la base centrale avec les PV locaux, sans perdre ceux en attente */
function mergeRemote(remote) {
  var seen = {}, out = [];
  HIST.forEach(function (r) { if (r._pending) { seen[r.id] = 1; out.push(r); } });
  remote.forEach(function (r) { if (!seen[r.id]) { seen[r.id] = 1; out.push(r); } });
  HIST.forEach(function (r) { if (!seen[r.id]) { seen[r.id] = 1; out.push(r); } });
  out.sort(function (a, b) { return String(b.finishedAt || b.createdAt || '').localeCompare(String(a.finishedAt || a.createdAt || '')); });
  HIST.length = 0;
  out.forEach(function (r) { HIST.push(r); });
  saveLocal();
}

function flushPending(cb) {
  var queue = HIST.filter(function (r) { return r._pending; });
  if (!queue.length || !cloudOn()) { syncState.pending = queue.length; if (cb) cb(); return; }
  var i = 0;
  (function next() {
    if (i >= queue.length) { syncState.pending = HIST.filter(function (r) { return r._pending; }).length; saveLocal(); if (cb) cb(); return; }
    var rec = queue[i++];
    cloudInsert(rec).then(function () {
      delete rec._pending; syncState.lastError = ''; next();
    }).catch(function (e) {
      syncState.lastError = e.message; syncState.pending = HIST.filter(function (r) { return r._pending; }).length;
      saveLocal(); if (cb) cb();
    });
  })();
}

function storeSave(rec, cb) {
  rec._pending = true;
  saveLocal();
  if (!cloudOn()) {
    delete rec._pending; saveLocal();
    cb('PV enregistré sur cet appareil. Base centralisée non configurée — téléchargez le PDF.');
    return;
  }
  cloudInsert(rec).then(function () {
    delete rec._pending; syncState.lastError = ''; syncState.pending = HIST.filter(function (r) { return r._pending; }).length;
    saveLocal();
    cb('PV enregistré dans l\'historique de l\'équipe.');
  }).catch(function (e) {
    syncState.lastError = e.message;
    syncState.pending = HIST.filter(function (r) { return r._pending; }).length;
    saveLocal();
    cb('Pas de réseau : le PV est conservé sur le téléphone et sera envoyé automatiquement à la prochaine ouverture. Téléchargez le PDF.');
  });
}

function storeBoot() {
  if (!cloudOn()) return;
  flushPending(function () {
    cloudFetch().then(function (remote) {
      mergeRemote(remote);
      if (screen === 'home' || screen === 'history') render();
    }).catch(function (e) {
      syncState.lastError = e.message;
      if (screen === 'home' || screen === 'history') render();
    });
  });
}

/* bandeau d'état affiché dans l'historique */
function storeStatus() {
  if (!cloudOn()) {
    return { tone: 'warn', title: 'Mode local', text: 'Les PV ne sont enregistrés que sur cet appareil. Renseignez SUPABASE_URL et SUPABASE_KEY en haut du fichier pour centraliser l\'historique.' };
  }
  if (syncState.pending) {
    return { tone: 'warn', title: syncState.pending + ' PV en attente d\'envoi', text: 'Ils partiront automatiquement dès le retour du réseau.', retry: true };
  }
  if (syncState.lastError) {
    return { tone: 'bad', title: 'Base centralisée injoignable', text: syncState.lastError, retry: true };
  }
  return { tone: 'ok', title: 'Historique synchronisé', text: 'Tous les PV sont enregistrés dans la base de l\'équipe.' };
}

function storeRetry() {
  flushPending(function () {
    cloudFetch().then(function (remote) { mergeRemote(remote); render(); })
      .catch(function (e) { syncState.lastError = e.message; render(); });
  });
}

/* =========================================================
   Événements et démarrage
   ========================================================= */
function useCap(n) {
  try { return (window.claude && window.claude.use) ? window.claude.use(n) : Promise.resolve(null); }
  catch (e) { return Promise.resolve(null); }
}

var pendingPhoto = null;

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-new],[data-go],[data-nav],[data-dl],[data-act],[data-rm],[data-photo],[data-star],[data-clear],.seg button');
  if (!t) return;

  if (t.dataset.new) { lastSavedId(null); S = newPV(t.dataset.new); step = 1; screen = 'step'; render(); return; }
  if (t.dataset.go) {
    if (screen === 'step' && S && !confirm('Quitter ce PV ? Les informations saisies seront perdues.')) return;
    if (t.dataset.go === 'home' || screen === 'step') S = null;
    go(t.dataset.go);
    return;
  }
  if (t.dataset.nav) { nextStep(t.dataset.nav === 'next' ? 1 : -1); return; }
  if (t.dataset.dl) {
    var r = HIST.filter(function (x) { return x.id === t.dataset.dl; })[0];
    if (r) downloadPdf(r);
    return;
  }
  if (t.dataset.act === 'pdf') { downloadPdf(S); return; }
  if (t.dataset.act === 'sync') { if (typeof storeRetry === 'function') { toast('Synchronisation…'); storeRetry(); } return; }
  if (t.dataset.act === 'mail') { mailPv(S); return; }
  if (t.dataset.act === 'mail-last') {
    var lr = HIST.filter(function (x) { return x.id === lastSavedId(); })[0];
    if (lr) mailPv(lr);
    return;
  }
  if (t.dataset.rm) {
    S.damages = S.damages.filter(function (d) { return d.id !== t.dataset.rm; });
    renumber(); paintMarkers(); renderDmgList(); return;
  }
  if (t.dataset.photo) { pendingPhoto = t.dataset.photo; $('filepick').value = ''; $('filepick').click(); return; }
  if (t.dataset.star) {
    S.note = Number(t.dataset.star);
    document.querySelectorAll('[data-star]').forEach(function (b) { b.classList.toggle('on', Number(b.dataset.star) <= S.note); });
    $('starLabel').textContent = S.note + '/5 — ' + NOTE_LABEL[S.note];
    $('formerr').classList.remove('on');
    return;
  }
  if (t.dataset.clear) {
    var box = document.querySelector('[data-sig="' + t.dataset.clear + '"]');
    var cv = box.querySelector('canvas');
    cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
    box.classList.remove('signed', 'err');
    if (t.dataset.clear === 'Client') S.sigClient = ''; else S.sigDriver = '';
    return;
  }
  /* segmented control */
  var seg = t.closest('.seg');
  if (seg) {
    var row = t.closest('.row'), v = t.dataset.v;
    if (!row) return;
    var storeName = row.dataset.store, key = row.dataset.row;
    S[storeName][key] = v;
    seg.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b === t ? 'true' : 'false'); });
    row.classList.remove('err');
    $('formerr').classList.remove('on');
    if (storeName === 'travaux' && key === 'lavage') {
      if (v !== 'OUI') delete S.travaux.typeLavage;
      $('travList').innerHTML = travRows();
    }
  }
});

document.addEventListener('input', function (e) {
  var n = e.target;
  if (n.dataset.f) {
    S[n.dataset.f] = n.value;
    var w = n.closest('[data-fw]'); if (w) w.classList.remove('err');
    $('formerr').classList.remove('on');
    if (n.dataset.f === 'immat') $('brandSub').textContent = TYPES[S.type].label + (n.value ? ' · ' + plate(n.value) : '');
  }
  if (n.dataset.e) { S.equip[n.dataset.e] = n.value; var w2 = n.closest('[data-fw]'); if (w2) w2.classList.remove('err'); $('formerr').classList.remove('on'); }
  if (n.dataset.dn) { var d = S.damages.filter(function (x) { return x.id === n.dataset.dn; })[0]; if (d) d.note = n.value; }
});
document.addEventListener('change', function (e) {
  var n = e.target;
  if (n.dataset.dt) {
    var d = S.damages.filter(function (x) { return x.id === n.dataset.dt; })[0];
    if (d) { d.label = n.value; var h = n.closest('.dmg').querySelector('.dmg-h b'); if (h) h.textContent = d.label; }
  }
});

/* clic sur un schéma -> nouveau marqueur */
document.addEventListener('click', function (e) {
  var vw = e.target.closest('.view');
  if (!vw || screen !== 'step' || step !== 2) return;
  var r = vw.getBoundingClientRect();
  var x = (e.clientX - r.left) / r.width * 100, y = (e.clientY - r.top) / r.height * 100;
  if (x < 2 || x > 98 || y < 2 || y > 98) return;
  addDamage(vw.dataset.view, Math.round(x * 10) / 10, Math.round(y * 10) / 10);
});

/* photo */
$('filepick').addEventListener('change', function () {
  var f = this.files && this.files[0];
  if (!f || !pendingPhoto) return;
  var id = pendingPhoto; pendingPhoto = null;
  busy(true, 'Compression de la photo…');
  compressFile(f).then(function (url) {
    var d = S.damages.filter(function (x) { return x.id === id; })[0];
    if (d) {
      d.photos.push(url);
      var card = document.querySelector('[data-dmg="' + id + '"]');
      if (card) card.outerHTML = dmgCard(d, 0);
    }
    busy(false);
  }).catch(function () { busy(false); toast('Photo illisible, réessayez'); });
});

window.addEventListener('resize', function () { if (screen === 'step' && step === 2) paintMarkers(); });

/* démarrage */
HIST = storeLoad();
render();
storeBoot();

</script>
